// The enode.meta.v1 contract: what an eNode-go server, its catalogue daemons
// and an eMuleQt client agree on.
//
// Specified in eNode-go's docs/meta-search-torrent-usenet-plan.local.md. This
// file is the wire representation of that specification, not its authority:
// where the two disagree, the document wins and this file is wrong.
//
// The contract version is the package name. Adding a transport is not a version
// bump; removing a field is.
syntax = "proto3";

package enode.meta.v1;

option go_package = "github.com/ModderMule/enodemeta/gen/enode/meta/v1;metav1";

// MetaKind is the network a release belongs to.
//
// Values are prefixed because proto3 scopes enum values at the package level in
// C++, and eMuleQt generates C++ from this file.
enum MetaKind {
  META_KIND_UNSPECIFIED = 0;
  META_KIND_BT_V1 = 1;  // BitTorrent v1 or hybrid; identity is the 20-byte v1 infohash
  META_KIND_BT_V2 = 2;  // BitTorrent v2 only; identity is the 32-byte v2 infohash
  META_KIND_NZB = 3;    // Usenet; identity is the 32-byte canonical NZB digest
}

// MetaNetwork is a catalogue network: which daemon a search goes to. A network
// serves one or more MetaKinds (torrent: BT_V1 and BT_V2; Usenet: NZB).
enum MetaNetwork {
  // META_NETWORK_UNSPECIFIED: every network the server offers.
  META_NETWORK_UNSPECIFIED = 0;
  META_NETWORK_TORRENT = 1;
  META_NETWORK_USENET = 2;
}

// MetaEntry is one advertised row: a release, or one file inside it.
//
// Fields 1 to 16 are the specification's §6.5 layout, unchanged. Fields 17 and
// 18 were added because the hash's flag nibble cannot be derived without them
// (see docs/ingest-contract.md).
message MetaEntry {
  // meta_hash is the 16 bytes of §3.
  //
  // The server mints it; a daemon must leave it empty. Keeping hash
  // construction in one place means a daemon cannot mint a malformed or
  // colliding hash, and the scheme version stays the server's to bump.
  bytes meta_hash = 1;

  MetaKind kind = 2;

  // file_index is the selected file's ordinal, or 0xFFFFFFFF for the row that
  // stands for the whole release. It is the libtorrent file_index_t, so padding
  // files count.
  uint32 file_index = 3;

  // file_path is the path inside the torrent, or an NZB's subject. It is
  // authoritative over file_index when the hash's 0x2 flag is set.
  string file_path = 4;

  // name is what a client displays.
  string name = 5;

  // size is the selected file's size; total_size is the whole release's.
  uint64 size = 6;
  uint64 total_size = 7;

  // type is the eD2K file-type string: Audio, Video, Image, Doc, Pro, Arc, Iso.
  string type = 8;

  uint32 seeders = 9;
  uint32 peers = 10;

  // age_days is days since posting for Usenet, or since the torrent was first
  // seen.
  uint32 age_days = 11;

  // indexer names the catalogue that produced the row.
  string indexer = 12;

  // catalog_id is the daemon's own id for the release, echoed back when the
  // server asks for its metafile. It is unique per daemon, so a server keys
  // rows by (daemon, catalog_id).
  string catalog_id = 13;

  // magnet is a BitTorrent magnet URI. A row carrying one needs no metafile
  // fetch at all.
  string magnet = 14;

  // flags is the FT_META_FLAGS bitfield: password-protected, needs PAR2,
  // private tracker, magnet-only, v2 hash available.
  uint32 flags = 15;

  // identity is the pre-fold digest of §3.4: the infohash, or the canonical NZB
  // digest. The daemon computes it and the server folds it into meta_hash.
  bytes identity = 16;

  // file_count is how many selectable, non-padding files the release holds.
  //
  // It comes from the metafile rather than from how many rows were sent, so
  // that publishing fewer files of the same release does not change the hash of
  // the rows that are still published.
  uint32 file_count = 17;

  // path_authoritative asks the server to set the hash's 0x2 flag. A daemon
  // sets it when the index cannot be trusted on its own — an NZB's file order
  // is not fixed, and a path that had to be repaired to valid UTF-8 may be
  // spelled differently by another client.
  bool path_authoritative = 18;
}

// MetaFile is the bytes behind a row.
message MetaFile {
  MetaKind kind = 1;
  bytes content = 2;
  string content_type = 3;
}

// SearchRequest queries the part of a catalogue that is too large to publish.
//
// The shape is deliberately narrow: a full eD2K search expression does not
// translate cleanly into a full-text engine, and a query language invented here
// would have to be reimplemented by every consumer. Keywords plus the filters a
// search panel already offers covers what a server needs to blend results.
message SearchRequest {
  // query is a set of keywords. All of them must match.
  string query = 1;

  // exclude drops a result whose text matches any of these.
  repeated string exclude = 2;

  repeated MetaKind kinds = 3;

  uint64 min_size = 4;
  uint64 max_size = 5;
  uint32 min_seeders = 6;
  uint32 max_age_days = 7;

  // type filters on the eD2K file-type string, ignoring case. A file row is
  // kept when its own type matches; a release's whole-set row is kept when it
  // matches or when any of that release's file rows does. An unknown type
  // matches nothing.
  string type = 8;

  // limit is how many releases to return, not rows: a multi-file release is
  // several rows. It is capped by the server.
  uint32 limit = 9;

  // offset skips this many of the best-matching releases, which is how a
  // later page is asked for. The server searches a bounded window, so an offset
  // past it returns nothing; follow SearchResponse.next_offset rather than
  // computing offsets, since the server may have capped limit.
  uint32 offset = 10;

  // network limits MetaApi.Search to one network; UNSPECIFIED searches all of
  // them. A daemon serves a single network and ignores it. kinds still applies
  // on top, to the rows of the networks searched.
  MetaNetwork network = 11;

  // Fields 12 onwards are filters and orders a daemon answers from the
  // attributes its index already holds, so none of them costs more than a
  // comparison per matching release. A filter or sort that does not exist on a
  // network is ignored by that network's daemon, the way a Usenet daemon drops
  // min_seeders: refusing the whole search over it would make a mixed-network
  // client choose between asking and getting answers.

  // sort orders the results. UNSPECIFIED is relevance. A sort the network does
  // not have falls back to relevance.
  SearchSort sort = 12;

  // sort_ascending reverses sort. It is ignored for RELEVANCE and BEST, which
  // are only ever best-first.
  bool sort_ascending = 13;

  // categories keeps a Usenet release filed under any of these newznab
  // categories. A root (5000) matches every leaf under it (5040).
  repeated uint32 categories = 14;

  // groups keeps a Usenet release crawled from any of these newsgroups, by
  // name. A name the daemon does not crawl narrows the search to nothing.
  repeated string groups = 15;

  // min_completion is a Usenet floor in hundredths of a percent: 9990 is 99.9%.
  uint32 min_completion = 16;

  // alive keeps a torrent whose last scrape found at least one seeder or
  // leecher. A torrent nobody has scraped has neither and is dropped.
  bool alive = 17;

  // min_leechers and min_popularity are torrent floors. Popularity is the
  // daemon's own demand counter and is comparable within one daemon only.
  uint32 min_leechers = 18;
  uint64 min_popularity = 19;

  // min_grabs is a Usenet floor on how often a release was downloaded.
  uint32 min_grabs = 20;

  // min_files and max_files bound a release's file count. max_files = 1 asks
  // for single-file releases only.
  uint32 min_files = 21;
  uint32 max_files = 22;

  // seen_within_days keeps a torrent some peer asked for in the last so many
  // days — a better "still alive" than a scrape estimate for rare releases.
  uint32 seen_within_days = 23;

  // indexed_within_days keeps a Usenet release catalogued in the last so many
  // days, whenever it was posted. max_age_days is the posting date.
  uint32 indexed_within_days = 24;
}

// SearchSort is a result order.
//
// Only DATE, SIZE and SEEDERS read a key every network's MetaEntry carries, so
// only those merge into one order across networks; a search over several
// networks sorted by anything else interleaves them.
enum SearchSort {
  SEARCH_SORT_UNSPECIFIED = 0;  // relevance
  SEARCH_SORT_RELEVANCE = 1;    // full-text weight, name above file paths
  SEARCH_SORT_BEST = 2;         // relevance plus a demand bonus (seeders, grabs)
  SEARCH_SORT_DATE = 3;         // posted (Usenet) or first seen (torrent)
  SEARCH_SORT_SIZE = 4;
  SEARCH_SORT_FILES = 5;
  SEARCH_SORT_SEEDERS = 6;      // torrent
  SEARCH_SORT_LEECHERS = 7;     // torrent
  SEARCH_SORT_POPULARITY = 8;   // torrent
  SEARCH_SORT_LAST_SEEN = 9;    // torrent
  SEARCH_SORT_GRABS = 10;       // Usenet
  SEARCH_SORT_COMPLETION = 11;  // Usenet
  SEARCH_SORT_INDEXED = 12;     // Usenet: when the release was catalogued
}

message SearchResponse {
  repeated MetaEntry entries = 1;

  // total is how many releases matched before the limit, when the engine can
  // say cheaply. Zero means "not counted", not "none".
  uint64 total = 2;

  // next_offset is the offset of the next page. Zero means there is no further
  // page: either nothing more matched or the server's window is exhausted.
  uint32 next_offset = 3;

  // total_exact is true when total counts every match, false when it is a lower
  // bound or was not counted. A server that predates it never sets it, which
  // reads as "estimate" — the safe side.
  bool total_exact = 4;

  // window is how many releases paging reaches: offset plus limit never passes
  // it. Zero means the server did not say. With total and the page size it gives
  // the page count: min(total, window) divided by the page size, rounded up.
  uint32 window = 5;
}
