name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # gen/ is checked in; a stale regeneration shows up as a vet or build failure.
      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...
